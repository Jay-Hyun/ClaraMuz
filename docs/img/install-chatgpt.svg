<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 576" width="900" height="576"><rect width="900" height="576" rx="18" fill="#f6f8fb"/><rect width="900" height="64" rx="18" fill="#059669"/><rect y="40" width="900" height="24" fill="#059669"/><text x="40" y="42" font-family="-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="26" font-weight="800" fill="#fff">ChatGPT 앱에 설치하기 (회사 관리자가 1번만)</text><circle cx="64" cy="118" r="20" fill="#059669"/><text x="64" y="126" text-anchor="middle" font-family="-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#fff">1</text><text x="102" y="126" font-family="-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" fill="#0f172a">[관리자] Admin → Plugins → Add → Import marketplace</text><rect x="102" y="140" width="524" height="40" rx="10" fill="#e2e8f0" stroke="#059669" stroke-width="2"/><text x="112" y="167" font-family="-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="19" font-weight="700" fill="#0f172a">Admin ▸ Plugins ▸ Import marketplace</text><circle cx="64" cy="228" r="20" fill="#059669"/><text x="64" y="236" text-anchor="middle" font-family="-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#fff">2</text><text x="102" y="236" font-family="-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" fill="#0f172a">[관리자] Source 칸에 저장소 주소를 넣고 가져와요</text><rect x="102" y="250" width="524" height="40" rx="10" fill="#e2e8f0" stroke="#059669" stroke-width="2"/><text x="112" y="277" font-family="-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="19" font-weight="700" fill="#0f172a">https://github.com/Jay-Hyun/ClaraMuz</text><circle cx="64" cy="338" r="20" fill="#059669"/><text x="64" y="346" text-anchor="middle" font-family="-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#fff">3</text><text x="102" y="346" font-family="-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" fill="#0f172a">[관리자] clara-muz 를 직원에게 &quot;사용 가능&quot;으로 열어줘요</text><rect x="102" y="360" width="244" height="40" rx="10" fill="#e2e8f0" stroke="#059669" stroke-width="2"/><text x="112" y="387" font-family="-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="19" font-weight="700" fill="#0f172a">설치 정책: Available</text><circle cx="64" cy="448" r="20" fill="#059669"/><text x="64" y="456" text-anchor="middle" font-family="-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#fff">4</text><text x="102" y="456" font-family="-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="22" fill="#0f172a">[직원] Plugins 탭 → 회사 이름 탭에서 clara-muz 의 ＋ 를 눌러요</text><rect x="102" y="470" width="76" height="40" rx="10" fill="#e2e8f0" stroke="#059669" stroke-width="2"/><text x="112" y="497" font-family="-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="19" font-weight="700" fill="#0f172a">＋ 설치</text><text x="450" y="562" text-anchor="middle" font-family="-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" fill="#64748b">※ 이해를 돕는 예시 그림이에요. 개인 계정이면 관리자 대신 README의 &quot;관리자가 없다면&quot;을 보세요</text></svg>